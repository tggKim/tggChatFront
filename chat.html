<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TGG Chat</title>
  <link rel="stylesheet" href="css/chat.css" />
  <script src="https://unpkg.com/lucide@0.468.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
</head>
<body>
<main class="app-container">
  <div id="chat-layout-wireframe" aria-label="TGG 채팅 애플리케이션">
    <div class="cw-shell">
      <aside class="cw-sidebar" aria-label="채팅 탐색">
        <header class="cw-sidebar-header">
          <span class="cw-sidebar-title" id="cw-sidebar-title">채팅</span>
          <button type="button" class="btn btn-ghost cw-icon-button" id="cw-new-chat-button" aria-label="새 채팅방" data-tooltip="새 채팅방">
            <i data-lucide="plus" aria-hidden="true"></i>
          </button>
          <button type="button" class="btn btn-ghost cw-icon-button" id="cw-add-friend-button" aria-label="친구 추가" data-tooltip="친구 추가" hidden>
            <i data-lucide="user-plus" aria-hidden="true"></i>
          </button>
        </header>

        <div class="cw-room-list cw-sidebar-view" id="cw-chat-list-view" aria-live="polite">
          <div class="cw-list-state">채팅방을 불러오는 중입니다.</div>
        </div>

        <div class="cw-room-list cw-sidebar-view" id="cw-friend-list-view" hidden aria-live="polite">
          <div class="cw-list-state">친구를 불러오는 중입니다.</div>
        </div>

        <div class="cw-room-list cw-sidebar-view" id="cw-settings-view" hidden>
          <div class="cw-settings-profile">
            <div class="cw-profile-image-control">
              <span class="cw-avatar cw-avatar-profile" id="cw-my-avatar" aria-label="현재 프로필 이미지">?</span>
              <button type="button" class="btn btn-primary cw-icon-button cw-profile-camera-button" id="cw-profile-image-button" aria-label="프로필 이미지 수정" data-tooltip="프로필 이미지 수정 준비 중">
                <i class="cw-profile-camera-icon" data-lucide="camera" aria-hidden="true"></i>
              </button>
            </div>
            <div class="cw-profile-name-control">
              <span class="cw-profile-name" id="cw-my-name">-</span>
              <button type="button" class="btn btn-ghost cw-icon-button" id="cw-edit-my-name" aria-label="내 이름 수정" data-tooltip="내 이름 수정">
                <i data-lucide="pencil" aria-hidden="true"></i>
              </button>
            </div>
            <button type="button" class="btn" id="cw-logout-button">로그아웃</button>
          </div>
        </div>

        <nav class="cw-bottom-nav" aria-label="주요 메뉴">
          <button type="button" class="cw-nav-button" id="cw-friends-tab" aria-selected="false">
            <i data-lucide="users" aria-hidden="true"></i><span class="text-small">친구</span>
          </button>
          <button type="button" class="cw-nav-button is-selected" id="cw-chats-tab" aria-selected="true">
            <i data-lucide="message-circle" aria-hidden="true"></i><span class="text-small">채팅</span>
          </button>
          <button type="button" class="cw-nav-button" id="cw-settings-tab" aria-selected="false">
            <i data-lucide="settings" aria-hidden="true"></i><span class="text-small">설정</span>
          </button>
        </nav>
      </aside>

      <section class="cw-main" id="cw-main" aria-label="선택한 채팅방">
        <div class="cw-empty-room" id="cw-empty-room">
          <i data-lucide="message-circle" aria-hidden="true"></i>
          <span>채팅방을 선택하세요.</span>
        </div>

        <div class="cw-active-room" id="cw-active-room" hidden>
          <header class="cw-room-header">
            <span class="cw-avatar-stack" id="cw-room-header-avatars"></span>
            <div class="cw-room-header-copy">
              <div class="cw-room-name" id="cw-room-header-name"></div>
              <div class="cw-member-count text-small" id="cw-room-header-count"></div>
            </div>
            <div class="cw-header-actions">
              <button type="button" class="btn btn-ghost cw-icon-button" id="cw-detail-button" aria-label="참여자 상세정보" aria-expanded="false" data-tooltip="참여자 정보">
                <i data-lucide="users" aria-hidden="true"></i>
              </button>
              <button type="button" class="btn btn-ghost cw-icon-button cw-room-close-button" id="cw-room-close" aria-label="현재 채팅 닫기" data-tooltip="현재 채팅 닫기">
                <i data-lucide="x" aria-hidden="true"></i>
              </button>
            </div>
          </header>

          <div class="cw-messages" id="cw-messages" aria-label="메시지 내용" aria-live="polite">
            <button type="button" class="btn cw-load-older" id="cw-load-older">이전 메시지</button>
            <div class="cw-list-state">메시지를 불러오는 중입니다.</div>
          </div>

          <form class="cw-composer" id="cw-composer">
            <button type="button" class="btn btn-ghost cw-icon-button" id="cw-file-button" aria-label="파일 첨부" data-tooltip="파일 첨부 준비 중">
              <i data-lucide="paperclip" aria-hidden="true"></i>
            </button>
            <input class="form-control" id="cw-message-input" aria-label="메시지 입력" placeholder="메시지를 입력하세요" autocomplete="off" />
            <button type="submit" class="btn btn-primary cw-icon-button" aria-label="메시지 전송" data-tooltip="전송">
              <i data-lucide="send" aria-hidden="true"></i>
            </button>
          </form>
        </div>

        <aside class="cw-detail-panel" id="cw-detail-panel" aria-label="참여자 상세정보" hidden>
          <div class="cw-detail-header">
            <span class="cw-sidebar-title" id="cw-detail-title">참여자</span>
            <div class="cw-detail-actions">
              <button type="button" class="btn btn-ghost cw-icon-button" id="cw-invite-button" aria-label="사용자 초대" data-tooltip="사용자 초대">
                <i data-lucide="plus" aria-hidden="true"></i>
              </button>
              <button type="button" class="btn btn-ghost cw-icon-button" id="cw-name-button" aria-label="채팅방 이름 편집" aria-expanded="false" data-tooltip="이름 편집">
                <i data-lucide="pencil" aria-hidden="true"></i>
              </button>
              <button type="button" class="btn btn-ghost cw-icon-button" id="cw-detail-close" aria-label="상세정보 닫기" data-tooltip="상세정보 닫기">
                <i data-lucide="x" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="cw-member-list" id="cw-member-list"></div>
          <button type="button" class="btn btn-danger btn-block cw-leave-button" id="cw-leave-button">채팅방 나가기</button>
        </aside>
      </section>

      <div class="cw-dialog-backdrop" id="cw-name-popover" hidden>
        <section class="card cw-dialog" role="dialog" aria-modal="true" aria-labelledby="cw-name-dialog-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-name-dialog-title">이름 설정</span>
            <button type="button" class="btn btn-ghost cw-icon-button" id="cw-name-close" aria-label="이름 편집 닫기"><i data-lucide="x" aria-hidden="true"></i></button>
          </div>
          <div class="cw-current-name">
            <span class="cw-label text-small">현재 표시 이름</span>
            <strong id="cw-display-name-setting"></strong>
          </div>
          <div class="cw-name-setting-row">
            <div class="cw-name-setting-copy">
              <span class="cw-label text-small">기본 이름</span>
              <span class="cw-name-setting-value" id="cw-base-name-value">설정되지 않음</span>
            </div>
            <button type="button" class="btn btn-ghost cw-icon-button" id="cw-edit-base-name" aria-label="기본 이름 수정" data-tooltip="방장만 수정 가능">
              <i data-lucide="pencil" aria-hidden="true"></i>
            </button>
          </div>
          <div class="cw-name-setting-row">
            <div class="cw-name-setting-copy">
              <span class="cw-label text-small">내가 보는 이름</span>
              <span class="cw-name-setting-value" id="cw-custom-name-value">설정되지 않음</span>
            </div>
            <button type="button" class="btn btn-ghost cw-icon-button" id="cw-edit-custom-name" aria-label="내가 보는 이름 수정" data-tooltip="내 이름 수정">
              <i data-lucide="pencil" aria-hidden="true"></i>
            </button>
          </div>
        </section>
      </div>

      <div class="cw-dialog-backdrop" id="cw-friend-add-dialog" hidden>
        <form class="card cw-dialog" id="cw-friend-add-form" role="dialog" aria-modal="true" aria-labelledby="cw-friend-add-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-friend-add-title">친구 추가</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-dialog aria-label="친구 추가 닫기"><i data-lucide="x" aria-hidden="true"></i></button>
          </div>
          <label class="form-label" for="cw-friend-username">친구 이름</label>
          <input id="cw-friend-username" class="form-control" maxlength="50" placeholder="정확한 사용자명을 입력하세요" required />
          <div class="cw-dialog-actions">
            <button type="button" class="btn" data-close-dialog>취소</button>
            <button type="submit" class="btn btn-primary">추가</button>
          </div>
        </form>
      </div>

      <div class="cw-dialog-backdrop" id="cw-new-chat-dialog" hidden>
        <form class="card cw-dialog" id="cw-new-chat-form" role="dialog" aria-modal="true" aria-labelledby="cw-new-chat-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-new-chat-title">새 채팅방</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-dialog aria-label="새 채팅방 닫기"><i data-lucide="x" aria-hidden="true"></i></button>
          </div>
          <div class="cw-invite-list" id="cw-new-chat-friends" aria-label="친구 선택"></div>
          <div class="cw-field" id="cw-group-name-field" hidden>
            <label class="form-label" for="cw-group-name">기본 채팅방 이름 <span class="text-muted">선택</span></label>
            <input id="cw-group-name" class="form-control" maxlength="100" />
          </div>
          <div class="cw-dialog-actions">
            <button type="button" class="btn" data-close-dialog>취소</button>
            <button type="submit" class="btn btn-primary" id="cw-new-chat-submit" disabled>채팅 시작</button>
          </div>
        </form>
      </div>

      <div class="cw-dialog-backdrop" id="cw-friend-profile-dialog" hidden>
        <section class="card cw-dialog" role="dialog" aria-modal="true" aria-labelledby="cw-friend-profile-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-friend-profile-title">친구 프로필</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-dialog aria-label="친구 프로필 닫기"><i data-lucide="x" aria-hidden="true"></i></button>
          </div>
          <div class="cw-profile-dialog-body">
            <span class="cw-avatar cw-avatar-profile" id="cw-friend-profile-avatar">?</span>
            <span class="cw-profile-dialog-name" id="cw-friend-profile-name"></span>
          </div>
          <button type="button" class="btn btn-primary btn-block" id="cw-friend-profile-chat">채팅하기</button>
        </section>
      </div>

      <div class="cw-dialog-backdrop" id="cw-invite-dialog" hidden>
        <form class="card cw-dialog" id="cw-invite-form" role="dialog" aria-modal="true" aria-labelledby="cw-invite-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-invite-title">사용자 초대</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-dialog aria-label="사용자 초대 닫기"><i data-lucide="x" aria-hidden="true"></i></button>
          </div>
          <div class="cw-invite-list" id="cw-invitable-friends"></div>
          <div class="cw-dialog-actions">
            <button type="button" class="btn" data-close-dialog>취소</button>
            <button type="submit" class="btn btn-primary" id="cw-invite-submit" disabled>초대</button>
          </div>
        </form>
      </div>

      <div class="cw-dialog-backdrop" id="cw-edit-dialog" hidden>
        <form class="card cw-dialog" id="cw-edit-form" role="dialog" aria-modal="true" aria-labelledby="cw-edit-dialog-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-edit-dialog-title">이름 수정</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-dialog aria-label="이름 수정 닫기"><i data-lucide="x" aria-hidden="true"></i></button>
          </div>
          <label class="form-label" id="cw-edit-input-label" for="cw-edit-input">이름</label>
          <input id="cw-edit-input" class="form-control" maxlength="100" required />
          <div class="cw-dialog-actions">
            <button type="button" class="btn" data-close-dialog>취소</button>
            <button type="submit" class="btn btn-primary">저장</button>
          </div>
        </form>
      </div>

      <div class="cw-dialog-backdrop" id="cw-leave-dialog" hidden>
        <form class="card cw-dialog" id="cw-leave-form" role="dialog" aria-modal="true" aria-labelledby="cw-leave-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-leave-title">채팅방 나가기</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-dialog aria-label="채팅방 나가기 닫기"><i data-lucide="x" aria-hidden="true"></i></button>
          </div>
          <p class="cw-dialog-copy" id="cw-leave-copy">채팅방을 나가시겠습니까?</p>
          <div class="cw-field" id="cw-next-owner-field" hidden>
            <label class="form-label" for="cw-next-owner">다음 방장</label>
            <select id="cw-next-owner" class="form-control"></select>
          </div>
          <div class="cw-dialog-actions">
            <button type="button" class="btn" data-close-dialog>취소</button>
            <button type="submit" class="btn btn-danger">나가기</button>
          </div>
        </form>
      </div>

      <div class="cw-dialog-backdrop" id="cw-message-dialog" hidden>
        <section class="card cw-dialog" role="alertdialog" aria-modal="true" aria-labelledby="cw-message-dialog-text">
          <p class="cw-dialog-copy" id="cw-message-dialog-text"></p>
          <div class="cw-dialog-actions">
            <button type="button" class="btn btn-primary" id="cw-message-dialog-confirm">확인</button>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
<script type="module" src="js/chat.js"></script>
</body>
</html>

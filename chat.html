<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TGG Chat</title>
  <script>
    (() => {
      const mobileUserAgent = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      const iPadDesktopMode = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      const mobileDevice = navigator.userAgentData?.mobile === true || mobileUserAgent || iPadDesktopMode;
      document.documentElement.classList.toggle("mobile-layout", mobileDevice);
    })();
  </script>
  <link rel="stylesheet" href="css/chat.css" />
  <script src="https://unpkg.com/lucide@0.468.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
</head>
<body>
<main class="app-container">
  <div id="chat-layout-wireframe" aria-label="TGG 채팅 애플리케이션">
    <div class="cw-shell">
      <aside class="cw-sidebar" aria-label="채팅 탐색">
        <header class="cw-sidebar-header">
          <span class="cw-sidebar-title" id="cw-sidebar-title">채팅</span>
          <button type="button" class="btn btn-ghost cw-icon-button" id="cw-new-chat-button" aria-label="새 채팅방" data-tooltip="새 채팅방">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-plus"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
          </button>
          <button type="button" class="btn btn-ghost cw-icon-button" id="cw-add-friend-button" aria-label="친구 추가" data-tooltip="친구 추가" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-user-plus"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><line x1="19" x2="19" y1="8" y2="14" /><line x1="22" x2="16" y1="11" y2="11" /></svg>
          </button>
        </header>

        <div class="cw-room-list cw-sidebar-view" id="cw-chat-list-view" aria-live="polite">
          <div class="cw-list-state">채팅방을 불러오는 중입니다.</div>
        </div>

        <div class="cw-room-list cw-sidebar-view" id="cw-friend-list-view" hidden aria-live="polite">
          <div class="cw-list-state">친구를 불러오는 중입니다.</div>
        </div>

        <div class="cw-room-list cw-sidebar-view" id="cw-settings-view" hidden>
          <div class="cw-settings-profile">
            <div class="cw-profile-image-control">
              <button type="button" class="cw-avatar cw-avatar-profile" id="cw-my-avatar" aria-label="현재 프로필 이미지"></button>
              <button type="button" class="btn btn-primary cw-icon-button cw-profile-camera-button" id="cw-profile-image-button" aria-label="프로필 이미지 수정" data-tooltip="프로필 이미지 수정">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-camera cw-profile-camera-icon" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /><circle cx="12" cy="13" r="3" /></svg>
              </button>
              <input type="file" id="cw-profile-image-input" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
            </div>
            <div class="cw-profile-name-control">
              <span class="cw-profile-name" id="cw-my-name">-</span>
              <button type="button" class="btn btn-ghost cw-icon-button" id="cw-edit-my-name" aria-label="내 이름 수정" data-tooltip="내 이름 수정">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-pencil"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg>
              </button>
            </div>
            <button type="button" class="btn" id="cw-logout-button">로그아웃</button>
          </div>
        </div>

        <nav class="cw-bottom-nav" aria-label="주요 메뉴">
          <button type="button" class="cw-nav-button" id="cw-friends-tab" aria-selected="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-users"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg><span class="text-small">친구</span>
          </button>
          <button type="button" class="cw-nav-button is-selected" id="cw-chats-tab" aria-selected="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-message-circle"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg><span class="text-small">채팅</span>
          </button>
          <button type="button" class="cw-nav-button" id="cw-settings-tab" aria-selected="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg><span class="text-small">설정</span>
          </button>
        </nav>
      </aside>

      <section class="cw-main" id="cw-main" aria-label="선택한 채팅방">
        <div class="cw-empty-room" id="cw-empty-room">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-message-circle"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg>
          <span>채팅방을 선택하세요.</span>
        </div>

        <div class="cw-active-room" id="cw-active-room" hidden>
          <header class="cw-room-header">
            <span class="cw-avatar-stack" id="cw-room-header-avatars"></span>
            <div class="cw-room-header-copy">
              <div class="cw-room-name" id="cw-room-header-name"></div>
              <div class="cw-member-count text-small" id="cw-room-header-count"></div>
            </div>
            <div class="cw-header-actions">
              <button type="button" class="btn btn-ghost cw-icon-button" id="cw-detail-button" aria-label="참여자 상세정보" aria-expanded="false" data-tooltip="참여자 정보">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-users"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>
              </button>
              <button type="button" class="btn btn-ghost cw-icon-button cw-room-close-button" id="cw-room-close" aria-label="현재 채팅 닫기" data-tooltip="현재 채팅 닫기">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x cw-room-close-icon" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left cw-room-back-icon" aria-hidden="true"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg>
              </button>
            </div>
          </header>

          <div class="cw-messages" id="cw-messages" aria-label="메시지 내용" aria-live="polite">
            <button type="button" class="btn cw-load-older" id="cw-load-older">이전 메시지</button>
            <div class="cw-list-state">메시지를 불러오는 중입니다.</div>
          </div>

          <button type="button" class="cw-new-message-notice" id="cw-new-message-notice" aria-label="새 메시지로 이동" hidden>
            <span id="cw-new-message-notice-text"></span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-chevron-down"><path d="m6 9 6 6 6-6" /></svg>
          </button>

          <form class="cw-composer" id="cw-composer">
            <button type="button" class="btn btn-ghost cw-icon-button" id="cw-file-button" aria-label="파일 첨부" data-tooltip="파일 첨부">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-paperclip"><path d="M13.234 20.252 21 12.3" /><path d="m16 6-8.414 8.586a2 2 0 0 0 0 2.828 2 2 0 0 0 2.828 0l8.414-8.586a4 4 0 0 0 0-5.656 4 4 0 0 0-5.656 0l-8.415 8.585a6 6 0 1 0 8.486 8.486" /></svg>
            </button>
            <input type="file" id="cw-file-input" multiple hidden />
            <input class="form-control" id="cw-message-input" aria-label="메시지 입력" placeholder="메시지를 입력하세요" autocomplete="off" />
            <button type="submit" class="btn btn-primary cw-icon-button" aria-label="메시지 전송" data-tooltip="전송">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-send"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" /><path d="m21.854 2.147-10.94 10.939" /></svg>
            </button>
          </form>
        </div>

        <aside class="cw-detail-panel" id="cw-detail-panel" aria-label="참여자 상세정보" hidden>
          <div class="cw-detail-header">
            <span class="cw-sidebar-title" id="cw-detail-title">참여자</span>
            <div class="cw-detail-actions">
              <button type="button" class="btn btn-ghost cw-icon-button" id="cw-invite-button" aria-label="사용자 초대" data-tooltip="사용자 초대">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-plus"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
              </button>
              <button type="button" class="btn btn-ghost cw-icon-button" id="cw-name-button" aria-label="채팅방 이름 편집" aria-expanded="false" data-tooltip="이름 편집">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-pencil"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg>
              </button>
              <button type="button" class="btn btn-ghost cw-icon-button" id="cw-detail-close" aria-label="상세정보 닫기" data-tooltip="상세정보 닫기">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
              </button>
            </div>
          </div>
          <div class="cw-member-list" id="cw-member-list"></div>
          <button type="button" class="btn btn-danger btn-block cw-leave-button" id="cw-leave-button">채팅방 나가기</button>
        </aside>
      </section>

      <div class="cw-dialog-backdrop" id="cw-name-popover" hidden>
        <section class="card cw-dialog" role="dialog" aria-modal="true" aria-labelledby="cw-name-dialog-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-name-dialog-title">이름 설정</span>
            <button type="button" class="btn btn-ghost cw-icon-button" id="cw-name-close" aria-label="이름 편집 닫기"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
          </div>
          <div class="cw-current-name">
            <span class="cw-label text-small">현재 표시 이름</span>
            <strong id="cw-display-name-setting"></strong>
          </div>
          <div class="cw-name-setting-row">
            <div class="cw-name-setting-copy">
              <span class="cw-label text-small">기본 이름</span>
              <span class="cw-name-setting-value" id="cw-base-name-value">설정되지 않음</span>
            </div>
            <button type="button" class="btn btn-ghost cw-icon-button" id="cw-edit-base-name" aria-label="기본 이름 수정" data-tooltip="방장만 수정 가능">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-pencil"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg>
            </button>
          </div>
          <div class="cw-name-setting-row">
            <div class="cw-name-setting-copy">
              <span class="cw-label text-small">내가 보는 이름</span>
              <span class="cw-name-setting-value" id="cw-custom-name-value">설정되지 않음</span>
            </div>
            <button type="button" class="btn btn-ghost cw-icon-button" id="cw-edit-custom-name" aria-label="내가 보는 이름 수정" data-tooltip="내 이름 수정">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-pencil"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg>
            </button>
          </div>
        </section>
      </div>

      <div class="cw-dialog-backdrop" id="cw-friend-add-dialog" hidden>
        <form class="card cw-dialog" id="cw-friend-add-form" role="dialog" aria-modal="true" aria-labelledby="cw-friend-add-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-friend-add-title">친구 추가</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-dialog aria-label="친구 추가 닫기"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
          </div>
          <label class="form-label" for="cw-friend-username">친구 이름</label>
          <input id="cw-friend-username" class="form-control" maxlength="50" placeholder="정확한 사용자명을 입력하세요" required />
          <div class="cw-dialog-actions">
            <button type="button" class="btn" data-close-dialog>취소</button>
            <button type="submit" class="btn btn-primary">추가</button>
          </div>
        </form>
      </div>

      <div class="cw-dialog-backdrop" id="cw-new-chat-dialog" hidden>
        <form class="card cw-dialog" id="cw-new-chat-form" role="dialog" aria-modal="true" aria-labelledby="cw-new-chat-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-new-chat-title">새 채팅방</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-dialog aria-label="새 채팅방 닫기"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
          </div>
          <div class="cw-invite-list" id="cw-new-chat-friends" aria-label="친구 선택"></div>
          <div class="cw-field" id="cw-group-name-field" hidden>
            <label class="form-label" for="cw-group-name">기본 채팅방 이름 <span class="text-muted">선택</span></label>
            <input id="cw-group-name" class="form-control" maxlength="100" />
          </div>
          <div class="cw-dialog-actions">
            <button type="button" class="btn" data-close-dialog>취소</button>
            <button type="submit" class="btn btn-primary" id="cw-new-chat-submit" disabled>채팅 시작</button>
          </div>
        </form>
      </div>

      <div class="cw-dialog-backdrop" id="cw-friend-profile-dialog" hidden>
        <section class="card cw-dialog" role="dialog" aria-modal="true" aria-labelledby="cw-friend-profile-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-friend-profile-title">사용자 프로필</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-dialog aria-label="사용자 프로필 닫기"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
          </div>
          <div class="cw-profile-dialog-body">
            <button type="button" class="cw-avatar cw-avatar-profile" id="cw-friend-profile-avatar" aria-label="프로필 원본 이미지 보기"></button>
            <span class="cw-profile-dialog-name" id="cw-friend-profile-name"></span>
          </div>
          <button type="button" class="btn btn-primary btn-block" id="cw-friend-profile-chat">채팅하기</button>
        </section>
      </div>

      <div class="cw-dialog-backdrop" id="cw-invite-dialog" hidden>
        <form class="card cw-dialog" id="cw-invite-form" role="dialog" aria-modal="true" aria-labelledby="cw-invite-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-invite-title">사용자 초대</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-dialog aria-label="사용자 초대 닫기"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
          </div>
          <div class="cw-invite-list" id="cw-invitable-friends"></div>
          <div class="cw-dialog-actions">
            <button type="button" class="btn" data-close-dialog>취소</button>
            <button type="submit" class="btn btn-primary" id="cw-invite-submit" disabled>초대</button>
          </div>
        </form>
      </div>

      <div class="cw-dialog-backdrop" id="cw-edit-dialog" hidden>
        <form class="card cw-dialog" id="cw-edit-form" role="dialog" aria-modal="true" aria-labelledby="cw-edit-dialog-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-edit-dialog-title">이름 수정</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-dialog aria-label="이름 수정 닫기"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
          </div>
          <label class="form-label" id="cw-edit-input-label" for="cw-edit-input">이름</label>
          <input id="cw-edit-input" class="form-control" maxlength="100" required />
          <div class="cw-dialog-actions">
            <button type="button" class="btn" data-close-dialog>취소</button>
            <button type="submit" class="btn btn-primary">저장</button>
          </div>
        </form>
      </div>

      <div class="cw-dialog-backdrop" id="cw-leave-dialog" hidden>
        <form class="card cw-dialog" id="cw-leave-form" role="dialog" aria-modal="true" aria-labelledby="cw-leave-title">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title" id="cw-leave-title">채팅방 나가기</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-dialog aria-label="채팅방 나가기 닫기"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
          </div>
          <p class="cw-dialog-copy" id="cw-leave-copy">채팅방을 나가시겠습니까?</p>
          <div class="cw-field" id="cw-next-owner-field" hidden>
            <label class="form-label" for="cw-next-owner">다음 방장</label>
            <select id="cw-next-owner" class="form-control"></select>
          </div>
          <div class="cw-dialog-actions">
            <button type="button" class="btn" data-close-dialog>취소</button>
            <button type="submit" class="btn btn-danger">나가기</button>
          </div>
        </form>
      </div>

      <div class="cw-dialog-backdrop" id="cw-message-dialog" hidden>
        <section class="card cw-dialog" role="alertdialog" aria-modal="true" aria-labelledby="cw-message-dialog-text">
          <p class="cw-dialog-copy" id="cw-message-dialog-text"></p>
          <div class="cw-dialog-actions">
            <button type="button" class="btn btn-primary" id="cw-message-dialog-confirm">확인</button>
          </div>
        </section>
      </div>

      <div class="cw-dialog-backdrop" id="cw-profile-image-dialog" hidden>
        <section class="card cw-dialog cw-profile-image-dialog" role="dialog" aria-modal="true" aria-label="프로필 원본 이미지">
          <div class="cw-popover-header">
            <span class="cw-sidebar-title">프로필 이미지</span>
            <button type="button" class="btn btn-ghost cw-icon-button" data-close-profile-image aria-label="프로필 이미지 닫기"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
          </div>
          <div
            class="cw-profile-original-image"
            id="cw-profile-original-image"
            role="img"
            aria-label="프로필 원본 이미지"
          ></div>
        </section>
      </div>

      <div class="cw-dialog-backdrop" id="cw-message-media-dialog" hidden>
        <section
          class="card cw-dialog cw-message-media-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="cw-message-media-title"
        >
          <div class="cw-popover-header">
            <span class="cw-sidebar-title cw-message-media-title" id="cw-message-media-title">미디어</span>
            <button
              type="button"
              class="btn btn-ghost cw-icon-button"
              id="cw-message-media-close"
              aria-label="미디어 닫기"
            ><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
          </div>
          <div class="cw-message-media-viewer">
            <button
              type="button"
              class="btn btn-ghost cw-icon-button cw-message-media-navigation cw-message-media-previous"
              id="cw-message-media-previous"
              aria-label="이전 이미지"
              hidden
            ><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-chevron-left"><path d="m15 18-6-6 6-6" /></svg></button>
            <div class="cw-message-media-stage" id="cw-message-media-stage" aria-live="polite"></div>
            <button
              type="button"
              class="btn btn-ghost cw-icon-button cw-message-media-navigation cw-message-media-next"
              id="cw-message-media-next"
              aria-label="다음 이미지"
              hidden
            ><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-chevron-right"><path d="m9 18 6-6-6-6" /></svg></button>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
<script type="module" src="js/chat.js"></script>
</body>
</html>

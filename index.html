<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TGG Chat | 로그인</title>
  <link rel="stylesheet" href="css/auth.css" />
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-shell" aria-labelledby="auth-title">
      <header class="auth-header">
        <span class="auth-brand-mark" aria-hidden="true">T</span>
        <span class="auth-brand-name">TGG Chat</span>
      </header>

      <form class="auth-form" id="login-form">
        <div class="auth-heading">
          <h1 id="auth-title">로그인</h1>
        </div>

        <div class="form-field">
          <label for="login-email">이메일</label>
          <input
            id="login-email"
            name="email"
            type="text"
            inputmode="email"
            autocomplete="email"
            maxlength="254"
            required
          />
        </div>

        <div class="form-field">
          <label for="login-password">비밀번호</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="auth-actions">
          <button class="btn btn-primary" type="submit" id="login-submit">로그인</button>
          <div class="auth-divider" role="separator"><span>또는</span></div>
          <button class="btn btn-google" type="button" id="google-login">
            <svg class="google-icon" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.702-1.567 2.684-3.874 2.684-6.614Z" />
              <path fill="#34A853" d="M9 18c2.43 0 4.468-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.584-5.037-3.71H.956v2.332A9 9 0 0 0 9 18Z" />
              <path fill="#FBBC05" d="M3.963 10.71A5.41 5.41 0 0 1 3.681 9c0-.593.102-1.169.282-1.71V4.958H.956A9 9 0 0 0 0 9c0 1.45.347 2.824.956 4.042l3.007-2.332Z" />
              <path fill="#EA4335" d="M9 3.58c1.322 0 2.508.454 3.441 1.346l2.581-2.581C13.464.892 11.426 0 9 0A9 9 0 0 0 .956 4.958L3.963 7.29C4.672 5.164 6.656 3.58 9 3.58Z" />
            </svg>
            <span>Google로 계속하기</span>
          </button>
          <button class="btn btn-kakao" type="button" id="kakao-login">
            <svg class="kakao-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3C6.477 3 2 6.582 2 11c0 2.875 1.897 5.397 4.742 6.807L5.68 21.7c-.094.344.299.617.59.41l4.662-3.108c.35.033.706.05 1.068.05 5.523 0 10-3.582 10-8S17.523 3 12 3Z" />
            </svg>
            <span>카카오로 계속하기</span>
          </button>
          <button class="btn" type="button" id="show-signup">회원가입</button>
        </div>
      </form>

      <form class="auth-form" id="signup-form" hidden>
        <div class="auth-heading">
          <h1>회원가입</h1>
        </div>

        <div class="form-field">
          <label for="signup-email">이메일</label>
          <input
            id="signup-email"
            name="email"
            type="text"
            inputmode="email"
            autocomplete="email"
            maxlength="254"
            required
          />
        </div>

        <div class="form-field">
          <label for="signup-password">비밀번호</label>
          <input
            id="signup-password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-field">
          <label for="signup-username">유저명</label>
          <input
            id="signup-username"
            name="username"
            type="text"
            autocomplete="username"
            maxlength="50"
            required
          />
        </div>

        <div class="auth-actions">
          <button class="btn btn-primary" type="submit" id="signup-submit">회원가입</button>
          <button class="btn" type="button" id="show-login">로그인으로 돌아가기</button>
        </div>
      </form>
    </section>

    <div class="dialog-backdrop" id="error-dialog" hidden>
      <section
        class="error-dialog"
        role="alertdialog"
        aria-modal="true"
        aria-label="오류"
        aria-describedby="error-message"
      >
        <p id="error-message"></p>
        <button class="btn btn-primary" type="button" id="error-confirm">확인</button>
      </section>
    </div>
    <div class="dialog-backdrop" id="signup-success-dialog" hidden>
      <section
        class="signup-success-dialog"
        role="dialog"
        aria-modal="true"
        aria-label="회원가입 성공"
        aria-describedby="signup-success-message"
      >
        <p id="signup-success-message">회원가입이 완료되었습니다.</p>
        <button class="btn btn-primary" type="button" id="signup-success-confirm">확인</button>
      </section>
    </div>
  </main>
</body>
</html>
